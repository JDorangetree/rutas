[theme]
primaryColor = "#FC4C02"          # Naranja Pantone 1655 C – acento obligatorio
backgroundColor = "#FFFFFF"       # Blanco corporativo
secondaryBackgroundColor = "#F4F7F5"  # Blanco suave para paneles
textColor = "#51534A"             # Gris Pantone 418 C para texto
font = "sans serif"               # Equivalente a Museo Sans / Arial

[server]
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
headless = true

[browser]
gatherUsageStats = false
